[Tera Term]
; Run headlessly without modal interruption
HideTitle=on
AutoWinClose=on
ConfirmDisconnect=off

; Encoding & Buffer Configuration
KanjiReceive=UTF8
KanjiSend=UTF8
ScrollBuffSize=100000

; Performance & Timing Pacing
FileSendHighSpeedMode=on
DelayPerChar=0
DelayPerLine=0

; Robust Paste Protection
BracketedSupport=on
BracketedControlOnly=on

; Automated Log Rotation Defaults
LogRotate=0
LogTimestamp=1
LogTimestampFormat=3
