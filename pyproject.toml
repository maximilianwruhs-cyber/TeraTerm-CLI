[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tt-agent-hw"
version = "0.1.0"
description = "Autonomous single-target Tera Term hardware flash+verify orchestrator"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "tt-agent-hw" }]
dependencies = [
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
tt-agent-hw = "tt_agent_hw.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tt_agent_hw"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/templates",
    "/config",
    "/README.md",
    "/pyproject.toml",
    "/docs",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "hardware: requires real COM port and Tera Term (set TT_AGENT_HW=1)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
